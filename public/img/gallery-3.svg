<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4f0"/>
      <stop offset="50%" style="stop-color:#fcf8fe"/>
      <stop offset="100%" style="stop-color:#f0e6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="12" fill="url(#bg3)"/>
  <!-- Banner text area -->
  <rect x="50" y="140" width="700" height="120" rx="20" fill="#854b71" opacity="0.15"/>
  <rect x="60" y="150" width="680" height="100" rx="16" fill="#854b71" opacity="0.1" stroke="#854b71" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Text lines -->
  <rect x="150" y="175" width="500" height="8" rx="4" fill="#854b71" opacity="0.5"/>
  <rect x="200" y="195" width="400" height="8" rx="4" fill="#854b71" opacity="0.4"/>
  <rect x="250" y="215" width="300" height="6" rx="3" fill="#854b71" opacity="0.3"/>
  <!-- Confetti -->
  <circle cx="120" cy="100" r="6" fill="#ffb7e2" opacity="0.6"/>
  <rect x="160" y="80" width="10" height="10" rx="2" fill="#d1b3ff" opacity="0.5" transform="rotate(45 165 85)"/>
  <circle cx="350" cy="90" r="5" fill="#ffb7e2" opacity="0.5"/>
  <rect x="500" y="75" width="12" height="12" rx="3" fill="#d1b3ff" opacity="0.5" transform="rotate(30 506 81)"/>
  <circle cx="650" cy="95" r="6" fill="#854b71" opacity="0.3"/>
  <rect x="700" y="110" width="8" height="8" rx="2" fill="#ffb7e2" opacity="0.4" transform="rotate(60 704 114)"/>
  <!-- Bottom confetti -->
  <circle cx="200" cy="330" r="5" fill="#d1b3ff" opacity="0.4"/>
  <rect x="450" y="340" width="10" height="10" rx="2" fill="#ffb7e2" opacity="0.4" transform="rotate(20 455 345)"/>
  <circle cx="600" cy="320" r="4" fill="#854b71" opacity="0.3"/>
  <!-- Stars -->
  <text x="90" y="65" font-size="24" fill="#ffb7e2" opacity="0.5">✦</text>
  <text x="720" y="60" font-size="20" fill="#d1b3ff" opacity="0.5">✦</text>
  <text x="400" y="310" font-size="18" fill="#ffb7e2" opacity="0.4">✦</text>
</svg>