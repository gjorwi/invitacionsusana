<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcf8fe"/>
      <stop offset="100%" style="stop-color:#fce4f0"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#854b71"/>
      <stop offset="100%" style="stop-color:#6b5195"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bg)"/>
  <!-- Crown -->
  <path d="M160 140 l-30 50 l30 -15 l20 30 l20 -30 l30 15 l-30 -50" fill="url(#primary)" opacity="0.8"/>
  <!-- Face circle -->
  <circle cx="200" cy="210" r="55" fill="url(#primary)" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="185" cy="205" r="4" fill="white"/>
  <circle cx="215" cy="205" r="4" fill="white"/>
  <!-- Smile -->
  <path d="M185 225 Q200 240 215 225" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Spa flower -->
  <g transform="translate(260, 160)">
    <circle cx="0" cy="-10" r="8" fill="#ffb7e2" opacity="0.8"/>
    <circle cx="10" cy="-3" r="8" fill="#ffb7e2" opacity="0.8"/>
    <circle cx="6" cy="8" r="8" fill="#ffb7e2" opacity="0.8"/>
    <circle cx="-6" cy="8" r="8" fill="#ffb7e2" opacity="0.8"/>
    <circle cx="-10" cy="-3" r="8" fill="#ffb7e2" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#854b71"/>
  </g>
  <!-- Stars -->
  <text x="130" y="120" font-size="20" fill="#ffb7e2">✦</text>
  <text x="250" y="110" font-size="14" fill="#ffb7e2">✦</text>
  <text x="290" y="200" font-size="12" fill="#d1b3ff">✦</text>
  <text x="110" y="250" font-size="16" fill="#d1b3ff">✦</text>
  <!-- Sparkles -->
  <circle cx="150" cy="130" r="3" fill="#ffb7e2" opacity="0.6"/>
  <circle cx="270" cy="180" r="2" fill="#d1b3ff" opacity="0.6"/>
  <circle cx="120" cy="180" r="2" fill="#ffb7e2" opacity="0.6"/>
  <circle cx="280" cy="240" r="2.5" fill="#d1b3ff" opacity="0.6"/>
</svg>